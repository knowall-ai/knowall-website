name: Build and deploy to Azure Web App - knowall-website

on:
  # Deploy when a release tag is created (e.g., v1.0.0), like Thyme/Zapdesk
  push:
    tags:
      - 'v*'
  # Allow manual deployment of any ref
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # Tag *deletions* also fire on.push.tags (payload has deleted: true) — skip those
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Setup Node.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'default-admin-key' }}

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x ".git/*" -x ".github/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production - Azure'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      # OIDC: the app registration trusts this repo's "Production - Azure" environment and has
      # Website Contributor on the site only, so no Azure secret is stored.
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-5.6-sol' }}
          AZURE_OPENAI_VOICE_ENDPOINT: ${{ secrets.AZURE_OPENAI_VOICE_ENDPOINT }}
          AZURE_OPENAI_VOICE_API_KEY: ${{ secrets.AZURE_OPENAI_VOICE_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          echo "Setting up environment variables for Azure App Service"
          az webapp config appsettings set --name knowall-website --resource-group "$AZURE_RESOURCE_GROUP" --settings \
            "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" \
            "AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY" \
            "AZURE_OPENAI_DEPLOYMENT=$AZURE_OPENAI_DEPLOYMENT" \
            "AZURE_OPENAI_VOICE_ENDPOINT=$AZURE_OPENAI_VOICE_ENDPOINT" \
            "AZURE_OPENAI_VOICE_API_KEY=$AZURE_OPENAI_VOICE_API_KEY" \
            "ADMIN_API_KEY=$ADMIN_API_KEY" \
            NODE_ENV=production
          # Azure OpenAI only: remove the retired direct-OpenAI key if it is still set.
          az webapp config appsettings delete --name knowall-website --resource-group "$AZURE_RESOURCE_GROUP" \
            --setting-names OPENAI_API_KEY OPENAI_MODEL --output none

      - name: Configure Node.js version
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            # Set Node.js version using the correct parameter
            az webapp config set --name knowall-website --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --linux-fx-version "NODE|22-lts"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'knowall-website'
          slot-name: 'Production'
          package: .

      - name: 'Restart web app'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            # Restart the web app to ensure all changes are applied
            az webapp restart --name knowall-website --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
            echo "Web app restarted, deployment complete"
