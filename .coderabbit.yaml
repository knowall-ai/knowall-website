# CodeRabbit configuration for knowall-website
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated / binary / vendored content — not worth review tokens
    - "!docs/screenshots/**"
    - "!public/presentations/vendor/**"
    - "!public/images/**"
    - "!package-lock.json"
    - "!logs/**"
  path_instructions:
    - path: "app/**/*.tsx"
      instructions: >-
        Next.js 15 App Router with a custom server.js. Watch client/server
        component boundaries and that no secrets reach client components.
    - path: "components/**/*.tsx"
      instructions: >-
        Nostr-native site: events must be signature-verified where trust
        matters, replaceable events must merge (fetch-latest) rather than
        clobber, and relay fetches should fail open for public content.
    - path: "tools/**"
      instructions: >-
        Node ESM CLI tooling. Signing goes through Amber (NIP-46) with a
        human approval step — flag anything that could sign or publish
        without an explicit --yes/dry-run gate.

chat:
  auto_reply: true
